name: Validate, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Validation: refuses labels in the map's own voice, working notes, unattributed claims, bad links.
      - run: python build.py --check
      # The viewer, driven in a real browser: every view, the guide, the timeline, search, phone width.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: python test/make_fixture.py && python build.py --data test/fixture --no-site --out dist/fixture.html && node test/smoke.js dist/fixture.html
      # The site. Kept out of search engines unless the repository variable PUBLIC is set to true.
      - run: python tools/package.py ${{ vars.PUBLIC == 'true' && '--public' || '' }}
      - run: node test/reread.js dist/site
      # Cloudflare Pages: on when the repository variable CLOUDFLARE is true and the two secrets are set.
      # main publishes the site; a pull request gets its own preview address.
      - name: Publish to Cloudflare Pages
        if: vars.CLOUDFLARE == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=${{ vars.CLOUDFLARE_PROJECT || 'ideals-map' }} --branch=${{ github.head_ref || github.ref_name }}
      # GitHub Pages instead: on only if the repository variable PAGES is true.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.PAGES == 'true'
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
